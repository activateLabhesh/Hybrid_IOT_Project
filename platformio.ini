; Hybrid-Flow — Smart Farm Irrigation Controller (ESP32)
;
;   Build + flash:   pio run -t upload
;   Serial monitor:  pio device monitor
;
; The web portal (web/*.html|js|css) is gzipped and embedded into the firmware
; automatically at build time by scripts/embed_web.py, so a single upload (or a
; single OTA update from the portal) updates both firmware and UI.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv   ; bigger app slots, OTA capable

extra_scripts = pre:scripts/embed_web.py

lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.6.0
    esp32async/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.2.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

build_flags =
    -DCORE_DEBUG_LEVEL=1
